name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  theme:
    name: Hugo ${{ matrix.hugo-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo-version:
          - "0.158.0"
          - "0.163.3"
          - latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Show Hugo version
        run: hugo version

      - name: Install test dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run theme regression tests
        run: scripts/test-theme.sh
